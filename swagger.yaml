definitions:
  Name:
    type: "object"
    required:
    - "name"
    properties:
      name:
        type: "string"
    xml:
      name: "Name"
    example:
      name: "name"
  UserTime:
    type: "object"
    required:
    - "timestamp"
    properties:
      timestamp:
        type: "integer"
    xml:
      name: "UserTime"
    example:
      timestamp: 0
  TotalTime:
    type: "object"
    properties:
      total_time:
        type: "integer"
        format: "int32"
        description: "运行完成需要的时间（单位ms）"
    xml:
      name: "TotalTime"
    example:
      total_time: 6
  RuntimeResponse:
    type: "object"
    required:
    - "code"
    - "data"
    - "msg"
    properties:
      code:
        type: "integer"
        format: "int32"
        description: "返回码，0表示正常"
      data:
        $ref: "#/definitions/TotalTime"
      msg:
        type: "string"
        example: "Success"
        description: "提示信息"
    xml:
      name: "RuntimeResponse"
    example:
      msg: "Success"
      code: 0
      data:
        total_time: 6
  CommonResponse:
    type: "object"
    required:
    - "code"
    - "data"
    - "msg"
    properties:
      code:
        type: "integer"
        format: "int32"
        description: "返回码，0表示正常"
      data:
        type: "object"
        example: {}
        properties: {}
      msg:
        type: "string"
        example: "Success"
        description: "提示信息"
    xml:
      name: "CommonResponse"
    example:
      msg: "Success"
      code: 0
      data: {}
  MotionsInfo:
    type: "object"
    required:
    - "music"
    - "name"
    properties:
      name:
        type: "string"
        description: "动作名称"
      music:
        type: "boolean"
        description: " - True 带有音乐\n- False 没有音乐 "
    xml:
      name: "MotionsInfo"
    example:
      music: true
      name: "name"
  MotionsList:
    type: "object"
    required:
    - "motions"
    properties:
      motions:
        type: "array"
        items:
          $ref: "#/definitions/MotionsInfo"
    xml:
      name: "MotionsList"
    example:
      motions:
      - music: true
        name: "name"
      - music: true
        name: "name"
  MotionsListResponse:
    type: "object"
    required:
    - "code"
    - "data"
    - "msg"
    properties:
      code:
        type: "integer"
        format: "int32"
        description: "返回码，0表示正常"
      data:
        $ref: "#/definitions/MotionsList"
      msg:
        type: "string"
        example: "Success"
        description: "提示信息"
    xml:
      name: "MotionsListResponse"
    example:
      msg: "Success"
      code: 0
      data:
        motions:
        - music: true
          name: "name"
        - music: true
          name: "name"
  MotionsStatus:
    type: "object"
    required:
    - "status"
    properties:
      status:
        type: "string"
        description: "运行状态"
        enum:
        - "idle"
        - "run"
        - "pause"
      name:
        type: "string"
        description: "动作名"
        default: "None"
      timestamp:
        type: "integer"
        format: "int64"
        example: 1551838515
        description: "时间戳, Unix标准时间"
    xml:
      name: "MotionsStatus"
    example:
      name: "None"
      status: "idle"
      timestamp: 1551838515
  MotionsStatusResponse:
    type: "object"
    required:
    - "code"
    - "data"
    - "msg"
    properties:
      code:
        type: "integer"
        format: "int32"
        description: "返回码，0表示正常"
      data:
        $ref: "#/definitions/MotionsStatus"
      msg:
        type: "string"
        example: "Success"
        description: "提示信息"
    xml:
      name: "MotionsStatusResponse"
    example:
      msg: "Success"
      code: 0
      data:
        name: "None"
        status: "idle"
        timestamp: 1551838515
  MotionsParameter:
    type: "object"
    required:
    - "name"
    properties:
      name:
        type: "string"
        example: "raise"
        description: " 动作名称, 除了内置动作还有局部动作，局部动作的列表如下:\n- raise\n- crouch\n- stretch\n\
          - come on\n- wave\n- bend\n- walk\n- turn around\n- head\n- bow"
      direction:
        type: "string"
        description: " 部分局部动作有方向属性, 如果有则填此字段，否则不能填此字段！\n\n当name的值为 raise | stretch\
          \ | come on | wave 时，取值范围如下：\n- left\n- right\n- both\n\n当name的值为 bend |\
          \ turn around 时，取值范围如下：\n- left\n- right\n\n当name的值为 walk 时，取值范围如下：\n- forward\n\
          - backward\n- left\n- right\n\n当name的值为 head 时，取值范围如下：\n- forward\n- left\n\
          - right "
        enum:
        - "left"
        - "right"
        - "both"
        - "forward"
        - "backward"
      repeat:
        type: "integer"
        format: "int32"
        description: "动作重复执行的次数"
        minimum: 0
        default: 1
      speed:
        type: "string"
        description: " 所有的局部动作（见name中所列）可设置运动速度，取值范围如下：\n- very slow\n- slow\n- normal\n\
          - fast\n- very fast"
        default: "normal"
        enum:
        - "very slow"
        - "slow"
        - "normal"
        - "fast"
        - "very fast"
    xml:
      name: "MotionsParameter"
    example:
      repeat: 8
      name: "raise"
      speed: "normal"
      direction: "left"
  MotionsOperation:
    type: "object"
    required:
    - "operation"
    properties:
      operation:
        type: "string"
        description: "运动控制"
        default: "start"
        enum:
        - "start"
        - "pause"
        - "resume"
        - "stop"
        - "start_async"
      motion:
        $ref: "#/definitions/MotionsParameter"
      timestamp:
        type: "integer"
        format: "int64"
        example: 1551838515
        description: "时间戳, Unix标准时间"
    xml:
      name: "MotionsOperation"
    example:
