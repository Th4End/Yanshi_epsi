      parameters:
      - name: "body"
        in: "query"
        description: "获得离线合成语法名称"
        required: true
        type: "string"
      responses:
        "200":
          description: "发送成功"
          schema:
            $ref: "#/definitions/VoiceGetOfflineSyntaxResponse"
      x-swagger-router-controller: "apollo.controllers.voice_controller"
    post:
