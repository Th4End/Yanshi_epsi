  /motions/gait:
    get:
      tags:
      - "motions"
      summary: "获取步态任务状态"
      description: " - 0 --> 开始进入步态算法准备状态\n - 1 --> 已经进入步态准备状态\n - 2 --> 开始调用步态算法\
        , 也可接受速度更新\n - 3 --> 步态行走停止，到达最大步数\n - 4 --> 开始停止步态行走\n - 5 --> 已经停止步态行走\n\
        \ - 6 --> 开始推出步态算法准备状态\n - 7 --> 已经推出步态算法准备状态\n - 8 --> 空闲状态\n "
      operationId: "get_motions_gait"
      produces:
      - "application/json"
      parameters: []
      responses:
        "200":
          description: "Data  value will be {'status': 0, 'timestamp':10086}"
          schema:
            $ref: "#/definitions/CommonResponse"
      x-swagger-router-controller: "apollo.controllers.motions_controller"
    put:
      tags:
      - "motions"
      summary: "更新步态任务"
      operationId: "put_motions_gait"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/MotionsGaitOperation"
      responses:
        "200":
          description: "成功"
          schema:
            $ref: "#/definitions/CommonResponse"
      x-swagger-router-controller: "apollo.controllers.motions_controller"
    delete:
      tags:
      - "motions"
      summary: "步态任务结束并复位"
      description: " 在机器人复位前停止所有正在执行的步态任务\n"
      operationId: "delete_motions_gait"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/UserTime"
      responses:
        "200":
          description: "success"
          schema:
            $ref: "#/definitions/CommonResponse"
      x-swagger-router-controller: "apollo.controllers.motions_controller"
