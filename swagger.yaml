      description: "\n规则\n- 规则一: 当视频流开启, 其他视觉任务不能被开启\n- 规则二: 当其他视觉任务开启, 视频流任务不能被开启\
        \n- 规则三: 相同任务或者被认为是相同任务，不能同时开启两次，此规则适用于语音触发的视觉任务\n- 规则四: 视频流任务无须遵守规则三\n"
      operationId: "put_visions"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/VisionsTask"
      responses:
