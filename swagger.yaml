        speed: "normal"
        direction: "left"
      operation: "start"
      timestamp: 1551838515
  MotionsGaitOperation:
    type: "object"
    properties:
      period:
        type: "integer"
        description: "机器人每一步迈出的时间等级。 等级越大, 频率越小。 注意,  此值设为0表示停止任何行动,  而非'speed_v'和\
          'speed_h'同时设为0。 'period'相较于'speed_v'和'speed_h'有更高的优先级。 当'speed_v'和 'speed_h'有\
          效且同时为0时, 机器人将会原地踏步。"
        minimum: 0
        maximum: 5
      speed_v:
        type: "integer"
        description: "'speed_v' 表示机器人垂直速度等级。 如果值为正机器人向前走反之向后。 机器人没有垂直速度如果此值设为0。"
        minimum: -5
        maximum: 5
      speed_h:
        type: "integer"
        description: "'speed_h' 表示机器人水平速度等级。 如果值为正机器人向左走反之向右。 机器人没有水平速度如果此值设为0。"
        minimum: -5
        maximum: 5
      wave:
        type: "boolean"
        description: "是否行动时甩手。"
        default: false
      steps:
        type: "integer"
        description: "总步数。 最大总步数为integer类型最大值。 机器人默认行走十亿步, 当此值为0时。"
        minimum: 0
      timestamp:
        type: "integer"
        description: "Unix时间戳"
