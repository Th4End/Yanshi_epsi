      description: " 获取系统所有的离线语法名称，请注意系统默认的离线语法名称为defaut, 它不可以通过API来添加，删除以及修改。\n当前\
        的离线识别支持中文和英文，但是英文的离线识别是实验性的功能。 所有的英文字段都需要使用<html><font color=\"red\">大写驼峰的\
        格式</font></html>。\n```\n{\n\t\"grammar\": \"LocalCmd\",\n\t\"slot\": [\n\t\
        \t{\n\t\t\t\"name\": \"Pre\"\n\t\t},\n\t\t{\n\t\t\t\"name\": \"Commands\"\n\
        \t\t}\n\t],\n\t\"start\": \"LocalCmdStart\",\n\t\"startinfo\": \"[<Pre>]<Commands>\"\
        ,\n\t\"rule\": [\n\t\t{\n\t\t\t\"name\": \"Pre\",\n\t\t\t\"value\": \"IWantYou|Please|Start\"\
        \n\t\t},\n\t\t{\n\t\t\t\"name\": \"Commands\",\n\t\t\t\"value\": \"Dancing\"\
        \n\t\t}\n\t]\n}\n```\n\n离线语法的配置有以下约束条件，当条件不満满足时语音识别可能结果不正确。\n\n\n\n约束条件\n\
        - 字段不能重复;\n- 所有的slot字段不能重复;\n- 所有的rule字段不能为空，每个规则都必须保证其定义的唯一性，也就是规则名在同一个语义\
        中不能够被定义两次。 在定义规则时，要注意规则名称不能是 VOID、 NULL 和 GARBAGE，这三个规则名称被作为保留关键词为后续功能扩展使用\
        。;\n- 可以通过关键词!id 定义了记号所对应的语义。 语义只能支持数字，其它数字将会导致编译错诨。语义支持的数字范围为 32 位有符号整形，也\
        就是-2^(32-1) ~ 2^(32-1) -1（其中^表示幂操作），当定义的数字操作此范围时，会导致编译错误或者被截断\n\n语法规范使用一系列\
        操作符及内置关键词描述语法内容\n\n| 操作符 | 描述 | 示例 |\n|---|---|---|\n|!| 标识内置关键词的开始 | !grammar|\n\
        |<>| 定义规则名称 | &lt;name&gt;|\n|;| 结束符 | 表示一行结束|\n| &Iota; |或，定义并列结构| 张三&Iota;李\
        四|\n|[]|可选，表示内容可说可以说| &lt;call&gt;: [找] &lt;name&gt;|\n|:|定义规则| &lt;name&gt;:张\
        三(竖线)&Iota;李四|\n|()|封装操作，定义隐式规则 |&lt;call&gt;:找(张三(竖线)&Iota;李四)|\n|/* */|块\
        注释 |/*注释*/|\n|//|行注释| //注释|\n详细信息请参看： https://doc.xfyun.cn/msc_windows/%E8%AF%AD%E6%B3%95%EF%BC%88%E5%91%BD%E4%BB%A4%E8%AF%8D%EF%BC%89%E8%AF%86%E5%88%AB.html\n"
      operationId: "get_voice_offline_syntax"
      produces:
